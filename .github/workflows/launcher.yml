# Builds the desktop launcher (launcher/, Tauri 2) for Apple-silicon macOS
# and, as an untested preview, for Windows x64; runs its tests, checks that
# nothing from the game is in the bundles (launcher/scripts/check_bundle.py)
# and uploads the .app (zipped), the .dmg and the Windows installers (NSIS
# .exe, .msi) as artifacts. On a v* tag (or a manual run on one) it also
# attaches them to that GitHub release. The launcher carries no part of the
# port: it runs the builds the player made from their own disc
# (tools/rebuild.sh). The bundles are unsigned.
name: launcher

on:
  push:
    branches: [main]
    tags: ['v*']
    paths: ['launcher/**', '.github/workflows/launcher.yml']
  pull_request:
    paths: ['launcher/**', '.github/workflows/launcher.yml']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  macos-arm64:
    runs-on: macos-14
    timeout-minutes: 45
    defaults:
      run:
        working-directory: launcher
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: launcher/package-lock.json
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: launcher/src-tauri
      - run: npm ci
      - run: npm run typecheck
      - run: npm run build
      - run: cargo test
        working-directory: launcher/src-tauri
      - run: npx tauri build --bundles app,dmg
      - name: Check the bundles
        run: python3 scripts/check_bundle.py src-tauri/target/release/bundle/macos/*.app src-tauri/target/release/bundle/dmg/*.dmg
      - name: Zip the app
        run: |
          cd src-tauri/target/release/bundle/macos
          ditto -c -k --keepParent "Resistance Launcher.app" "../resistance-launcher_aarch64.app.zip"
      - uses: actions/upload-artifact@v4
        with:
          name: resistance-launcher-macos-arm64
          path: |
            launcher/src-tauri/target/release/bundle/resistance-launcher_aarch64.app.zip
            launcher/src-tauri/target/release/bundle/dmg/*.dmg
          retention-days: 30

  # Preview: the launcher builds and starts on Windows, but the port's own
  # Windows (D3D12) build is untested; the app says so in a banner.
  windows-x64:
    runs-on: windows-latest
    timeout-minutes: 60
    defaults:
      run:
        working-directory: launcher
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: launcher/package-lock.json
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: launcher/src-tauri
      - run: npm ci
      - run: npm run typecheck
      - run: npm run build
      # several tests assume Unix paths: informational on Windows
      - run: cargo test
        working-directory: launcher/src-tauri
        continue-on-error: true
      - run: npx tauri build --bundles nsis,msi
      - name: Check the bundles
        run: python scripts/check_bundle.py src-tauri/target/release/bundle/nsis src-tauri/target/release/bundle/msi src-tauri/target/release/resistance-launcher.exe
      - uses: actions/upload-artifact@v4
        with:
          name: resistance-launcher-windows-x64
          path: |
            launcher/src-tauri/target/release/bundle/nsis/*.exe
            launcher/src-tauri/target/release/bundle/msi/*.msi
          retention-days: 30

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [macos-arm64, windows-x64]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      TAG: ${{ github.ref_name }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
      - name: Name the files
        run: |
          set -e
          v=${TAG#v}
          mkdir out
          cp dist/resistance-launcher-macos-arm64/resistance-launcher_aarch64.app.zip "out/resistance-launcher_${v}_macos_aarch64.app.zip"
          cp dist/resistance-launcher-macos-arm64/dmg/*.dmg "out/resistance-launcher_${v}_macos_aarch64.dmg"
          cp dist/resistance-launcher-windows-x64/nsis/*.exe "out/resistance-launcher_${v}_windows_x64-setup-PREVIEW.exe"
          cp dist/resistance-launcher-windows-x64/msi/*.msi "out/resistance-launcher_${v}_windows_x64-PREVIEW.msi"
          ls -l out
      - name: Attach them to the release
        run: |
          set -e
          if ! gh release view "$TAG" >/dev/null 2>&1; then
            gh release create "$TAG" --verify-tag --prerelease --title "Resistance Recomp $TAG" --notes "Launcher builds for $TAG (macOS Apple silicon; Windows x64 preview, untested)."
          fi
          gh release upload "$TAG" out/* --clobber
